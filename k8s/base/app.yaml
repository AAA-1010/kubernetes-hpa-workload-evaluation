# Namespace, Deployment and Service for the test web application.
# The runner re-creates the namespace before every run so each run starts
# from an identical state. spec.replicas is overwritten by the runner with the
# configuration's starting replica count.
apiVersion: v1
kind: Namespace
metadata:
  name: hpa-exp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hpa-exp
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: hpa-web:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: WORK_ROUNDS
              value: "10000"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Probe timeouts are generous on purpose: under CPU saturation the
          # health check queues behind real requests, and the 1 s default
          # timeout made an overloaded pod drop out of the Service (pilot v1,
          # docs/pilot.md), which would turn slow responses into refusals.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hpa-exp
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
